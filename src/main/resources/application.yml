spring:
  application:
    name: pair
  datasource:
    url: jdbc:h2:mem:pairdb
    driver-class-name: org.h2.Driver
    username: pair
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode:
        always
  config:
    import: 
      - "optional:file:./.env[.properties]"
      - "optional:file:./.env-secret[.properties]"

pair:
  api:
    title: ${PAIR_TITLE}
    description: ${PAIR_DESCRIPTION}
    version: "@project.version@"
